<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found - Stackly</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="preloader-active">
<!-- PRELOADER -->
<div class="preloader" id="preloader">
<img alt="Stackly" class="preloader-logo" src="images/stackly logo.webp"/>
<div class="preloader-spinner"></div>
<div class="preloader-text">Loading</div>
</div>
<!-- ERROR / 404 - SECTION -->
    <section class="error-section">
        <div class="error-bg-shape one"></div>
        <div class="error-bg-shape two"></div>
        <div class="error-bg-shape three"></div>
        <div class="error-bg-shape four"></div>

        <div class="error-wrapper animate-on-scroll scale-in">
            <div class="error-card">
                <a href="index.html"><img src="images/stackly logo2.webp" alt="Stackly" class="error-logo"></a>
                <span class="error-code">404</span>
                <h1 class="error-title">Oops! Page Not Found</h1>
                <p class="error-text">The page you're looking for doesn't exist or has been moved. Let's get you back on track.</p>
                <div class="error-actions">
                    <button class="btn btn-outline" onclick="history.back()"><i class="fas fa-arrow-left" style="margin-right: 8px;"></i>Go Back</button>
                    <a href="index.html" class="btn btn-primary"><i class="fas fa-home" style="margin-right: 8px;"></i>Back To Home</a>
                </div>
            </div>
        </div>
    </section>

    <script src="js/main.js"></script>
</body>
</html>
